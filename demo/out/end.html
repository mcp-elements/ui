<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;height:100%}
  body{width:1280px;height:720px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 32%,#1d1622 0%,#0e0d12 72%);
    font-family:-apple-system,'Inter','Helvetica Neue',Arial,sans-serif;color:#fff;text-align:center}
  .badge{display:flex;align-items:center;gap:13px;margin-bottom:24px}
  .mark{width:46px;height:46px;border-radius:12px;background:#1a1418;border:1.5px solid #ff5c8a;
    display:flex;align-items:center;justify-content:center;font:700 17px ui-monospace,Menlo,monospace;color:#ff5c8a}
  .wordmark{font:600 22px ui-monospace,Menlo,monospace;color:#e8e6ea}
  .tag{font-size:27px;color:#a9a4b3;margin:8px 0 34px}
  code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:34px;font-weight:700;color:#ff7fa6;
    background:rgba(255,92,138,.12);padding:14px 28px;border-radius:12px;border:1px solid rgba(255,92,138,.3)}
  .links{margin-top:42px;font-size:26px;color:#d8d4de;line-height:1.7}
  .links .gh{color:#8b8794;font-size:22px}
</style></head><body>
  <div class="badge"><div class="mark">Mcp</div><div class="wordmark">mcp-elements</div></div>
  <div class="tag">MIT&nbsp;·&nbsp;framework-agnostic&nbsp;·&nbsp;you own the code</div>
  <code>npx mcp-elements add</code>
  <div class="links">
    mcp-elements.dev<br>
    <span class="gh">github.com/mcp-elements/ui</span>
  </div>
</body></html>
