<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;height:100%}
  body{width:1280px;height:720px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 32%,#1d1622 0%,#0e0d12 72%);
    font-family:-apple-system,'Inter','Helvetica Neue',Arial,sans-serif;color:#fff;text-align:center}
  .badge{display:flex;align-items:center;gap:14px;margin-bottom:30px}
  .mark{width:54px;height:54px;border-radius:14px;background:#1a1418;border:1.5px solid #ff5c8a;
    display:flex;align-items:center;justify-content:center;font:700 20px ui-monospace,Menlo,monospace;color:#ff5c8a}
  .wordmark{font:600 26px ui-monospace,Menlo,monospace;color:#e8e6ea}
  h1{font-size:80px;font-weight:800;margin:0;letter-spacing:-2.5px;line-height:1.04}
  h1 .pink{color:#ff5c8a}
  p{font-size:30px;margin:22px 0 0;color:#a9a4b3;font-weight:400;max-width:900px}
  .pill{margin-top:32px;font-size:21px;color:#ffb3cb;border:1px solid #ff5c8a;
    padding:10px 24px;border-radius:999px;background:rgba(255,92,138,.12)}
</style></head><body>
  <div class="badge"><div class="mark">Mcp</div><div class="wordmark">mcp-elements</div></div>
  <h1>The <span class="pink">MCP-native</span> UI kit</h1>
  <p>Consent dialogs, tool-call cards, scope inspectors — the trust UI every MCP host needs.</p>
  <div class="pill">React&nbsp;·&nbsp;Angular&nbsp;·&nbsp;Vue&nbsp;·&nbsp;copy-paste</div>
</body></html>
