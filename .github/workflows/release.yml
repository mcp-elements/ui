name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack only — do not publish to npm'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify npm auth (dry-run only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          echo "Authenticated as: $(npm whoami)"
          echo "--- @mcp-elements scope access ---"
          npm access list packages @mcp-elements 2>/dev/null || npm org ls mcp-elements 2>/dev/null || echo "(scope is empty/new — expected before first publish)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MCP_ELEMENT_NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MCP_ELEMENT_NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Dry run (pack only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: pnpm -r publish --access public --no-git-checks --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MCP_ELEMENT_NPM_TOKEN }}
